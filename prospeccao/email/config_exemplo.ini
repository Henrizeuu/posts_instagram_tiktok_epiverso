; CONFIGURAÇÃO DO ENVIO DE E-MAIL · EPIVERSO
; Copie este arquivo para config.ini e preencha. O config.ini não vai para o GitHub (.gitignore).

[remetente]
nome = Seu Nome
; Use um domínio SEPARADO para prospecção (ex.: epiversofiscal.com.br), nunca o principal. Veja o LEIA-ME.
email = seunome@seudominio-de-prospeccao.com.br
empresa = Epiverso
whatsapp = (48) 99208-6832

[smtp]
; Google Workspace / Gmail: smtp.gmail.com, porta 587
; Zoho: smtp.zoho.com, porta 587 · Outlook/Microsoft 365: smtp.office365.com, porta 587 · Hostinger: smtp.hostinger.com, porta 465
host = smtp.gmail.com
porta = 587
usuario =
; Senha: o mais seguro é a variável de ambiente EPIVERSO_SMTP_SENHA. No Gmail/Workspace é uma "senha de app".
senha =

[imap]
; Lê a caixa de entrada para PARAR a sequência de quem respondeu e tirar quem pediu para sair. Deixe ligado.
ativo = sim
host = imap.gmail.com
porta = 993

[envio]
; Planilha de leads (a mesma do WhatsApp serve). Caminho relativo a esta pasta.
leads = ../leads.csv
; Aquecimento automático: 10/dia na 1ª semana, 20 na 2ª, 30 na 3ª e depois este máximo (por caixa de e-mail).
limite_diario_max = 40
; Data do 1º envio (AAAA-MM-DD). Vazio = começa a contar no primeiro "enviar".
inicio_aquecimento =
; Espera aleatória entre um e-mail e outro, em segundos.
intervalo_min_seg = 90
intervalo_max_seg = 240
; Só envia de segunda a sexta, entre estes horários.
hora_inicio = 8
hora_fim = 18
; Dias úteis entre abertura e 1º follow-up, e entre o 1º e o 2º follow-up.
dias_entre_etapas = 3,4
